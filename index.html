 <!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעקב מהלכים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6578;
  --line:#D8DEE8; --orange:#F2711C; --orange-ink:#FFFFFF; --navy:#14213D; --navy-ink:#FFFFFF;
  --press:#FFE4D1; --danger:#C53030;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --surface:#18233A; --ink:#EEF2F8; --muted:#9AA6BC;
    --line:#2B3956; --navy:#24345A; --press:#4A2A14; --danger:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#18233A; --ink:#EEF2F8; --muted:#9AA6BC;
  --line:#2B3956; --navy:#24345A; --press:#4A2A14; --danger:#FF8A80; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Assistant",Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.screen{display:none;max-width:560px;margin:0 auto;padding:20px 16px 28px;min-height:100%;flex-direction:column}
.screen.active{display:flex}
h1,h2,.display{font-family:"Secular One","Assistant",Arial,sans-serif;font-weight:400;margin:0}
h1{font-size:2rem;line-height:1.15}
h2{font-size:1.4rem}
.sub{color:var(--muted);margin:4px 0 22px}

/* setup */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:700;font-size:.95rem}
.field input{font:inherit;font-size:1.1rem;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:100%}
.field input:focus{outline:none;border-color:var(--orange)}
.btn{font:inherit;font-weight:700;font-size:1.15rem;border:none;border-radius:14px;padding:16px;cursor:pointer;width:100%}
.btn-primary{background:var(--orange);color:var(--orange-ink)}
.btn-dark{background:var(--navy);color:var(--navy-ink)}
.btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:focus-visible,.stat:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
.resume{margin-top:12px}
.spacer{flex:1}

/* tracker */
.board{background:var(--navy);color:var(--navy-ink);border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.board .who{font-weight:700;font-size:1rem;line-height:1.25}
.board .vs{opacity:.75;font-size:.9rem}
.pts{text-align:center}
.pts .num{font-family:"Secular One",sans-serif;font-size:3.2rem;line-height:1;color:var(--orange)}
.pts .lbl{font-size:.8rem;opacity:.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{position:relative;font:inherit;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:16px;min-height:98px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;touch-action:manipulation;transition:transform .08s,background-color .2s}
.stat:active{transform:scale(.97)}
.stat.flash{background:var(--press)}
.stat .name{font-family:"Secular One",sans-serif;font-size:1.5rem}
.stat .val{font-family:"Secular One",sans-serif;font-size:2.4rem;line-height:1}
.stat .hint{position:absolute;bottom:8px;right:14px;font-size:.78rem;color:var(--muted)}
.stat.wide{grid-column:1 / -1}
.stat.score .name{color:var(--orange)}
.stat.miss{border-style:dashed}
.stat.miss .name{font-size:1.25rem;color:var(--muted)}
.stat.miss .val{color:var(--muted)}
.tiles.four{grid-template-columns:repeat(4,1fr);margin-top:-12px}
.tile .k small{display:block}
.row{display:flex;gap:10px;margin-top:10px}
.qbtn{margin-top:14px;border-color:var(--orange);font-family:"Secular One",sans-serif;font-weight:400;font-size:1.3rem}
.qwrap{background:var(--surface);border:2px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.qwrap h3{margin:0;padding:12px 14px;font-size:1rem;border-bottom:2px solid var(--line)}
.scroll{overflow-x:auto}
.qwrap table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.qwrap th,.qwrap td{padding:8px 6px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.qwrap th{font-size:.82rem;color:var(--muted);font-weight:600}
.qwrap td:first-child,.qwrap th:first-child{text-align:right;padding-right:12px}
.qwrap tfoot td{font-weight:700;border-bottom:none}
.qwrap .p{color:var(--orange);font-weight:700}
.qtag{color:var(--muted);font-size:.85rem}
.psum{margin-top:30px;padding-top:24px;border-top:2px solid var(--line)}
.psum .sub{margin-bottom:6px}
table.games tbody tr{cursor:pointer}
table.games tbody tr:hover,table.games tbody tr:focus-visible{background:var(--press);outline:none}
table.games td:nth-child(2){max-width:9rem;overflow:hidden;text-overflow:ellipsis}
.btn-danger{background:transparent;color:var(--danger);border:2px solid var(--danger)}
.sync{font-size:.8rem;color:var(--muted);margin-top:8px;text-align:center}
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,14,28,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--surface);color:var(--ink);border-radius:18px;padding:20px;width:100%;max-width:420px}
.sheet .sub{margin:6px 0 14px}
.sheet input{font:inherit;font-size:1.6rem;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.sheet input:focus{outline:none;border-color:var(--orange)}
.tile.big.pts2{grid-column:span 2}
.tile.big.mins{grid-column:span 1}
.tile.big.mins .v{font-size:2.2rem;color:var(--navy-ink);margin-top:.35rem}
.last{color:var(--muted);font-size:.95rem;min-height:1.5em;margin-top:12px;text-align:center}

/* summary */
.sumhead{margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 20px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.tile .v{font-family:"Secular One",sans-serif;font-size:1.9rem;line-height:1.1}
.tile .k{font-size:.85rem;color:var(--muted)}
.tile.big{grid-column:1 / -1;background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.tile.big .v{font-size:3rem;color:var(--orange)}
.tile.big .k{color:inherit;opacity:.8}
.log{background:var(--surface);border:2px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.log h3{margin:0;padding:12px 14px;font-size:1rem;border-bottom:2px solid var(--line)}
.log ol{list-style:none;margin:0;padding:0;max-height:320px;overflow-y:auto}
.log li{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line);font-size:.98rem}
.log li:last-child{border-bottom:none}
.log .t{color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}
.empty{padding:14px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.stat,.toast{transition:none}.stat:active{transform:none}}
</style>
</head>
<body>

<!-- מסך 1: פרטי משחק -->
<section class="screen active" id="setup">
  <h1>משחק חדש</h1>
  <p class="sub">מלאו את פרטי המשחק ולחצו על התחלה.</p>
  <div class="field"><label for="f-date">תאריך</label><input type="date" id="f-date"></div>
  <div class="field"><label for="f-player">שם שחקן</label><input type="text" id="f-player" value="ירין אדלר"></div>
  <div class="field"><label for="f-team">קבוצה</label><input type="text" id="f-team" value="נס ציונה - אגוז"></div>
  <div class="field"><label for="f-opp">קבוצה נגדית</label><input type="text" id="f-opp" placeholder="שם הקבוצה היריבה"></div>
  <button class="btn btn-primary" id="start">התחלת משחק</button>
  <button class="btn btn-ghost resume" id="resume" hidden>המשך משחק פתוח</button>

  <div class="psum" id="psum">
    <h2 id="ps-title">סיכום שחקן</h2>
    <p class="sub" id="ps-sub"></p>
    <div id="ps-body">
      <div class="tiles" id="ps-tiles"></div>
      <div class="tiles four" id="ps-tiles2"></div>
      <div class="qwrap"><h3>משחקים (לחצו על משחק לפירוט)</h3><div class="scroll"><table class="games" id="ps-table"></table></div></div>
    </div>
  </div>
</section>

<!-- מסך 2: מעקב -->
<section class="screen" id="track">
  <div class="board">
    <div>
      <div class="who" id="b-player"></div>
      <div class="vs" id="b-vs"></div>
    </div>
    <div class="pts"><div class="num" id="b-pts">0</div><div class="lbl">נקודות</div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="last" id="last" aria-live="polite"></div>
  <button class="btn btn-ghost qbtn" id="quarter">רבע ראשון</button>
  <div class="row">
    <button class="btn btn-ghost" id="undo" disabled>ביטול אחרון</button>
    <button class="btn btn-dark" id="finish">סיום וסיכום</button>
  </div>
</section>

<!-- מסך 3: סיכום -->
<section class="screen" id="summary">
  <div class="sumhead">
    <h1 id="s-player"></h1>
    <p class="sub" id="s-meta" style="margin-bottom:0"></p>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="tiles four" id="tiles2"></div>
  <div class="qwrap"><h3>חלוקה לפי רבע</h3><div class="scroll"><table id="qtable"></table></div></div>
  <div class="log"><h3>תיעוד מהלכים</h3><ol id="log"></ol></div>
  <div class="stack">
    <button class="btn btn-primary" id="share">שיתוף הסיכום</button>
    <button class="btn btn-ghost" id="back">המשך תיעוד המשחק</button>
    <button class="btn btn-dark" id="home">למסך הראשי</button>
    <button class="btn btn-danger" id="delete">מחיקת המשחק</button>
  </div>
</section>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h2 id="m-title"></h2>
    <p class="sub" id="m-sub"></p>
    <input type="number" id="m-input" inputmode="decimal" min="0" step="0.5" placeholder="למשל 7">
    <button class="btn btn-primary" id="m-ok" style="margin-top:14px">שמירה</button>
    <div class="row">
      <button class="btn btn-ghost" id="m-skip">דילוג</button>
      <button class="btn btn-ghost" id="m-cancel">ביטול</button>
    </div>
  </div>
</div>

<div class="modal" id="cmodal" hidden>
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="c-text">
    <h2 id="c-text"></h2>
    <div class="row" style="margin-top:16px">
      <button class="btn btn-ghost" id="c-no">ביטול</button>
      <button class="btn btn-primary" id="c-ok"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STATS = [
  {id:'fg',   name:'סל',     pts:2, hint:'2 נק׳'},
  {id:'three',name:'שלשה',   pts:3, hint:'3 נק׳'},
  {id:'ft',   name:'עונשין', pts:1, hint:'1 נק׳'},
  {id:'reb',  name:'ריבאונד',pts:0},
  {id:'ast',  name:'אסיסט',  pts:0},
  {id:'blk',  name:'גג',     pts:0},
  {id:'stl',  name:'חטיפה',  pts:0},
  {id:'m3',   name:'החטאה ל-3', pts:0, miss:true},
  {id:'m2',   name:'החטאה ל-2', pts:0, miss:true},
  {id:'m1',   name:'החטאה ל-1', pts:0, miss:true},
];
const SHOTS = [
  {made:'fg',    miss:'m2', label:'זריקות ל-2'},
  {made:'three', miss:'m3', label:'זריקות ל-3'},
  {made:'ft',    miss:'m1', label:'עונשין'},
];
const OTHER = ['reb','ast','blk','stl'];
const QUARTERS = ['ראשון','שני','שלישי','רביעי'];
const fmtMin = v => v==null ? '–' : String(Math.round(v*10)/10);
const fmt1 = v => String(Math.round(v*10)/10);
const totalMin = (g=game) => { const v=Object.values(g.minutes||{}).filter(x=>x!=null); return v.length ? v.reduce((a,b)=>a+b,0) : null; };

const $ = id => document.getElementById(id);
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmtDate = s => { const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; };
const fmtClock = ts => new Date(ts).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const fmtElapsed = ms => { const s=Math.floor(ms/1000); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; };
const countsOf = (g,q) => { const c={}; STATS.forEach(s=>c[s.id]=0); (g.events||[]).forEach(e=>{ if(!q||(e.q||1)===q) c[e.stat]++; }); return c; };
const counts = (q) => countsOf(game,q);
const points = c => STATS.reduce((sum,s)=>sum+c[s.id]*s.pts,0);
const statById = id => STATS.find(s=>s.id===id);
const esc = t => String(t).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id)); window.scrollTo(0,0); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600); }

/* ---------- שמירה בדפדפן ---------- */
const LS_GAMES='yarin-games', LS_CUR='yarin-current-id';
const lsGet = k => { try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
let games = lsGet(LS_GAMES) || {};
let currentId = lsGet(LS_CUR);
let game = null;
// העברת משחק פתוח מהגרסה הקודמת
const legacy = lsGet('yarin-current-game');
if (legacy && !legacy.id){ legacy.id='g'+(legacy.startedAt||Date.now()); legacy.updatedAt=Date.now(); games[legacy.id]=legacy; currentId=legacy.id;
  lsSet(LS_GAMES,games); lsSet(LS_CUR,currentId); try{ localStorage.removeItem('yarin-current-game'); }catch(e){} }

function persistLocal(){ lsSet(LS_GAMES,games); lsSet(LS_CUR,currentId); }
function save(){ game.updatedAt=Date.now(); games[game.id]=game; persistLocal(); }
function removeGame(id){ delete games[id]; if (currentId===id) currentId=null; persistLocal(); }


/* ---------- חלון אישור ---------- */
let confirmOk=null;
function askConfirm(text, okLabel, onOk){ confirmOk=onOk; $('c-text').textContent=text; $('c-ok').textContent=okLabel; $('cmodal').hidden=false; }
$('c-ok').onclick = () => { const f=confirmOk; $('cmodal').hidden=true; confirmOk=null; f&&f(); };
$('c-no').onclick = () => { $('cmodal').hidden=true; confirmOk=null; };
$('cmodal').addEventListener('click', e => { if (e.target.id==='cmodal') $('c-no').click(); });

/* ---------- מסך ראשי ---------- */
$('f-date').value = today();
function renderHome(){
  $('resume').hidden = !(currentId && games[currentId]);
  const player = $('f-player').value.trim();
  const list = Object.values(games).filter(g=>g.player===player)
    .sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.startedAt||0)-(a.startedAt||0));
  $('ps-title').textContent = `סיכום ${player || 'שחקן'}`;
  if (!list.length){
    $('ps-sub').textContent = 'עדיין אין משחקים שמורים. אחרי המשחק הראשון יופיעו כאן הממוצעים וטבלת המשחקים.';
    $('ps-body').hidden = true; return;
  }
  $('ps-body').hidden = false;
  const n=list.length, cs=list.map(g=>countsOf(g));
  const sum = id => cs.reduce((a,c)=>a+c[id],0);
  const mins = list.map(g=>totalMin(g)).filter(v=>v!=null);
  const avgPts = cs.reduce((a,c)=>a+points(c),0)/n;
  $('ps-sub').textContent = n===1 ? 'ממוצעים על פני משחק אחד' : `ממוצעים למשחק, על פני ${n} משחקים`;
  $('ps-tiles').innerHTML =
    `<div class="tile big pts2"><div class="v">${fmt1(avgPts)}</div><div class="k">נקודות למשחק</div></div>` +
    `<div class="tile big mins"><div class="v">${mins.length?fmt1(mins.reduce((a,b)=>a+b,0)/mins.length):'–'}</div><div class="k">דקות למשחק</div></div>` +
    SHOTS.map(s=>{ const m=sum(s.made), a=m+sum(s.miss);
      return `<div class="tile"><div class="v">${a?Math.round(m/a*100)+'%':'–'}</div><div class="k">${s.label}<small dir="ltr">${m}/${a}</small></div></div>`; }).join('');
  $('ps-tiles2').innerHTML = OTHER.map(id=>`<div class="tile"><div class="v">${fmt1(sum(id)/n)}</div><div class="k">${statById(id).name}</div></div>`).join('');
  $('ps-table').innerHTML =
    `<thead><tr><th>תאריך</th><th>יריבה</th><th>נק׳</th><th>דק׳</th><th>ל-2</th><th>ל-3</th><th>עונשין</th><th>ריב׳</th><th>אס׳</th><th>גג</th><th>חט׳</th></tr></thead><tbody>` +
    list.map((g,i)=>{ const c=cs[i];
      return `<tr data-id="${esc(g.id)}" tabindex="0"><td>${fmtDate(g.date)}</td><td>${esc(g.opponent)}</td><td class="p">${points(c)}</td><td>${fmtMin(totalMin(g))}</td>` +
        SHOTS.map(s=>`<td dir="ltr">${c[s.made]}/${c[s.made]+c[s.miss]}</td>`).join('') +
        OTHER.map(id=>`<td>${c[id]}</td>`).join('') + `</tr>`; }).join('') + '</tbody>';
}
function openGame(id){ if (!games[id]) return; game=games[id]; renderSummary(); show('summary'); }
$('ps-table').addEventListener('click', e => { const tr=e.target.closest('tr[data-id]'); if (tr) openGame(tr.dataset.id); });
$('ps-table').addEventListener('keydown', e => { if (e.key==='Enter'){ const tr=e.target.closest('tr[data-id]'); if (tr) openGame(tr.dataset.id); } });
$('f-player').addEventListener('input', renderHome);
function goHome(){ $('f-date').value=today(); $('f-opp').value=''; renderHome(); show('setup'); }

$('start').onclick = () => {
  const opp = $('f-opp').value.trim();
  if (!opp){ $('f-opp').focus(); toast('הזינו את שם הקבוצה הנגדית'); return; }
  const now = Date.now();
  game = {
    id: 'g'+now,
    date: $('f-date').value || today(),
    player: $('f-player').value.trim() || 'ירין אדלר',
    team: $('f-team').value.trim() || 'נס ציונה - אגוז',
    opponent: opp, startedAt: now, quarter: 1, minutes: {}, events: []
  };
  currentId = game.id; save(); openTracker();
};
$('resume').onclick = () => { if (games[currentId]){ game=games[currentId]; openTracker(); } };

/* tracker */
function buildGrid(){
  const g=$('grid'); g.innerHTML='';
  STATS.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='stat'+(s.pts?' score':'')+(s.miss?' miss':'')+(i===STATS.length-1&&STATS.length%2===1?' wide':'');
    b.id='btn-'+s.id;
    b.innerHTML=`<span class="name">${s.name}</span><span class="val" id="c-${s.id}">0</span>${s.hint?`<span class="hint">${s.hint}</span>`:''}`;
    b.onclick=()=>record(s.id,b);
    g.appendChild(b);
  });
}
function openTracker(){
  if (!game.quarter) game.quarter = 1;
  if (!game.minutes) game.minutes = {};
  $('b-player').textContent = game.player;
  $('b-vs').textContent = `${game.team} נגד ${game.opponent}`;
  refresh(); show('track');
}
function refresh(){
  const c=counts();
  STATS.forEach(s=>$('c-'+s.id).textContent=c[s.id]);
  $('b-pts').textContent=points(c);
  $('undo').disabled = game.events.length===0;
  $('quarter').textContent = `רבע ${QUARTERS[game.quarter-1]}`;
  const e=game.events[game.events.length-1];
  $('last').textContent = e ? `אחרון: ${statById(e.stat).name} ב-${fmtClock(e.t)}, רבע ${QUARTERS[(e.q||1)-1]}` : 'לחצו על מהלך כדי לתעד אותו';
}
function record(id,btn){
  game.events.push({stat:id,t:Date.now(),q:game.quarter});
  save(); refresh();
  btn.classList.add('flash'); setTimeout(()=>btn.classList.remove('flash'),180);
  if (navigator.vibrate) try{navigator.vibrate(25)}catch(e){}
}
$('undo').onclick = () => {
  const e=game.events.pop(); if(!e) return;
  save(); refresh(); toast(`בוטל: ${statById(e.stat).name}`);
};
/* חלון דקות */
let modalNext = null;
function askMinutes(q, okLabel, next){
  modalNext = next;
  $('m-title').textContent = `דקות משחק ברבע ${QUARTERS[q-1]}`;
  $('m-sub').textContent = `כמה דקות שיחק ${game.player} ברבע הזה?`;
  const cur = game.minutes[q];
  $('m-input').value = cur!=null ? cur : '';
  $('m-ok').textContent = okLabel;
  $('m-ok').dataset.q = q;
  $('modal').hidden = false;
  setTimeout(()=>$('m-input').focus(), 50);
}
function closeModal(){ $('modal').hidden = true; modalNext = null; }
$('m-ok').onclick = () => {
  const q = +$('m-ok').dataset.q, raw = $('m-input').value.trim().replace(',', '.');
  if (raw !== ''){
    const v = parseFloat(raw);
    if (isNaN(v) || v < 0){ toast('הזינו מספר דקות תקין'); return; }
    game.minutes[q] = v;
  }
  save(); const n = modalNext; closeModal(); n && n();
};
$('m-skip').onclick = () => { const n = modalNext; closeModal(); n && n(); };
$('m-cancel').onclick = closeModal;
$('m-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('m-ok').click(); });
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

$('quarter').onclick = () => {
  const nextQ = game.quarter % 4 + 1;
  askMinutes(game.quarter, `שמירה ומעבר לרבע ${QUARTERS[nextQ-1]}`, () => {
    game.quarter = nextQ;
    save(); refresh(); toast(`עברנו לרבע ${QUARTERS[game.quarter-1]}`);
  });
};
const goSummary = () => { renderSummary(); show('summary'); };
$('finish').onclick = () => {
  if (game.minutes[game.quarter] == null) askMinutes(game.quarter, 'שמירה ומעבר לסיכום', goSummary);
  else goSummary();
};

/* summary */
function renderSummary(){
  const c=counts(), p=points(c);
  $('s-player').textContent = game.player;
  $('s-meta').textContent = `${game.team} נגד ${game.opponent}, ${fmtDate(game.date)}`;
  const tiles=$('tiles');
  tiles.innerHTML = `<div class="tile big pts2"><div class="v">${p}</div><div class="k">נקודות</div></div>` +
    `<div class="tile big mins"><div class="v">${fmtMin(totalMin())}</div><div class="k">דקות</div></div>` +
    SHOTS.map(s=>{ const m=c[s.made], a=m+c[s.miss]; const pct=a?Math.round(m/a*100)+'%':'–';
      return `<div class="tile"><div class="v" dir="ltr">${m}/${a}</div><div class="k">${s.label}<small>${pct}</small></div></div>`; }).join('');
  $('tiles2').innerHTML = OTHER.map(id=>`<div class="tile"><div class="v">${c[id]}</div><div class="k">${statById(id).name}</div></div>`).join('');
  const row = (label,cc,mn) => `<td>${label}</td><td>${fmtMin(mn)}</td><td class="p">${points(cc)}</td>` +
    SHOTS.map(s=>`<td dir="ltr">${cc[s.made]}/${cc[s.made]+cc[s.miss]}</td>`).join('') +
    OTHER.map(id=>`<td>${cc[id]}</td>`).join('');
  $('qtable').innerHTML =
    `<thead><tr><th>רבע</th><th>דק׳</th><th>נק׳</th><th>ל-2</th><th>ל-3</th><th>עונשין</th><th>ריב׳</th><th>אס׳</th><th>גג</th><th>חט׳</th></tr></thead>` +
    '<tbody>' + QUARTERS.map((n,i)=>`<tr>${row(n,counts(i+1),(game.minutes||{})[i+1])}</tr>`).join('') + '</tbody>' +
    `<tfoot><tr>${row('סה״כ',c,totalMin())}</tr></tfoot>`;
  const log=$('log');
  log.innerHTML = game.events.length
    ? game.events.map((e,i)=>`<li><span>${i+1}. ${statById(e.stat).name} <span class="qtag">רבע ${QUARTERS[(e.q||1)-1]}</span></span><span class="t">${fmtClock(e.t)} (+${fmtElapsed(e.t-game.startedAt)})</span></li>`).join('')
    : '<li class="empty">עדיין לא תועדו מהלכים.</li>';
}
function summaryText(){
  const c=counts();
  const lines=[`🏀 ${game.player}`, `${game.team} נגד ${game.opponent}`, fmtDate(game.date), '', `נקודות: ${points(c)}`, `דקות: ${fmtMin(totalMin())}`];
  SHOTS.forEach(s=>{ const m=c[s.made], a=m+c[s.miss]; lines.push(`${s.label}: ${m}/${a}${a?` (${Math.round(m/a*100)}%)`:''}`); });
  OTHER.forEach(id=>lines.push(`${statById(id).name}: ${c[id]}`));
  lines.push('', 'לפי רבע:');
  QUARTERS.forEach((n,i)=>lines.push(`רבע ${n}: ${points(counts(i+1))} נק׳, ${fmtMin((game.minutes||{})[i+1])} דק׳`));
  return lines.join('\n');
}
$('share').onclick = async () => {
  const text=summaryText();
  if (navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(text); toast('הסיכום הועתק'); }catch(e){ toast('לא ניתן להעתיק במכשיר זה'); }
};
$('back').onclick = () => { currentId = game.id; persistLocal(); openTracker(); };
$('home').onclick = goHome;
$('delete').onclick = () => askConfirm(`למחוק את המשחק נגד ${game.opponent}?`, 'מחיקה', () => {
  removeGame(game.id); game=null; toast('המשחק נמחק'); goHome();
});

buildGrid();
renderHome();
</script>
</body>
</html>
